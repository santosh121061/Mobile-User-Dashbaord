name: Verify mobile application
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run test:paths
      - run: npm run validate:contracts
      - run: node scripts/validate-maestro.cjs
      - run: npm run generate:api && git diff --exit-code -- src/api/generated/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm audit --audit-level=high
