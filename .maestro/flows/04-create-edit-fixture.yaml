appId: ${MAESTRO_APP_ID}
tags: [critical, isolated, writes]
---
- runFlow: ../helpers/fresh.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      LOGIN_EMAIL: ${MAESTRO_OWNER_EMAIL}
- tapOn: Users
- tapOn: Add user
- extendedWaitUntil:
    visible: First name
    timeout: 15000
- tapOn: Work email
- inputText: ${MAESTRO_CREATE_EMAIL}
- tapOn: First name
- inputText: Maestro
- tapOn: Last name
- inputText: Fixture
- scrollUntilVisible:
    element:
      text: Phone number
    direction: DOWN
- tapOn: Phone number
- inputText: +12025550199
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Create user
    direction: DOWN
- tapOn: Create user
- extendedWaitUntil:
    visible: User created
    timeout: 15000
- assertVisible: .*Pending accounts still require administrator activation.*
- tapOn: User details
- tapOn: Edit user
- scrollUntilVisible:
    element:
      text: Phone number
    direction: DOWN
- extendedWaitUntil:
    visible: Phone number
    timeout: 15000
- tapOn: Phone number
- eraseText: 100
- inputText: +12025550198
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Save changes
    direction: DOWN
- tapOn: Save changes
- extendedWaitUntil:
    visible: User details
    timeout: 15000
- assertVisible: "+12025550198"
